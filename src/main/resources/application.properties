spring.application.name=knowledge-base
server.port=8081
# SQLite 数据库配置
# JDBC URL 格式：jdbc:sqlite:数据库文件路径
# ./knowledge.db 表示数据库文件放在项目根目录下
spring.datasource.url=jdbc:sqlite:./knowledge.db
# SQLite 自带的驱动类名（固定写这个就行）
spring.datasource.driver-class-name=org.sqlite.JDBC

# MyBatis 配置
# 告诉 MyBatis XML 映射文件在哪里
mybatis.mapper-locations=classpath:mapper/*.xml
# 开启驼峰命名自动映射（比如字段 create_time 自动映射到 createTime）
mybatis.configuration.map-underscore-to-camel-case=true
# Spring Boot 启动时自动执行 schema.sql 建表
spring.sql.init.mode=always
# SQLite 不需要用户名密码，但 Spring Boot 默认会检查，加下面两行避免警告
spring.datasource.username=
spring.datasource.password=
# Deepseek 调用配置
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.api-key=${DEEPSEEK_API_KEY}
#deepseek-chat v3模型
ai.deepseek.model=deepseek-chat
#调用超时时间30s
ai.deepseek.timeout-seconds=30
#导入时ai评分的最低星级(>= 3星才能入库)
ai.import.min-score=3